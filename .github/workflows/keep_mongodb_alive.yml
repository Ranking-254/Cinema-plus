name: Keep MongoDB Atlas Alive
on:
  schedule:
    - cron: "0 0 1,15 * *" # Runs on the 1st and 15th of every month
  workflow_dispatch: # Allows manual testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MongoDB
        run: |
          # Use mongosh (pre-installed on GitHub runners) to run a simple command
          mongosh "${{ secrets.MONGODB_URI }}" --eval "db.adminCommand({ ping: 1 })"
